name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Fuzz packet imports
        run: go test ./internal/packet -run '^$' -fuzz '^FuzzDecodePacket$' -fuzztime 20s -parallel 2

      - name: Fuzz packet text round trips and reports
        run: go test ./internal/packet -run '^$' -fuzz '^FuzzPacketText$' -fuzztime 20s -parallel 2

      - name: Retain failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packet-fuzz-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: internal/packet/testdata/fuzz/
          if-no-files-found: ignore
          archive: true
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Install interface dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build interface
        working-directory: ui
        run: pnpm build

      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        working-directory: ui
        run: pnpm test:e2e
